services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Service Booking API
      APP_ENV: production
      DEBUG: "False"
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:CHANGE_ME@host.docker.internal:5432/service_booking_db}
      SECRET_KEY: ${SECRET_KEY:-CHANGE_THIS_TO_A_SECURE_RANDOM_SECRET}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      ADMIN_SETUP_SECRET: ${ADMIN_SETUP_SECRET:-}
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:80"
    depends_on:
      - backend
